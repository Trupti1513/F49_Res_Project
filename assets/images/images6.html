<!--                            Center an Image

To center an image within the page, use margin: auto; and make it into a block element.

-->


<!DOCTYPE html>
<html>
<head>
<style>

img {
         margin: auto;
         display: block;
    }
	
</style>
</head>
<body>

<img src = "abs.jpg" alt = "abstract" width = "300px">

</body>
</html>
