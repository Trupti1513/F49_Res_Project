<!--                           Image Filters

The CSS filter property adds visual effects (like blur and saturation) to an element.

-->



<!DOCTYPE html>
<html>
<head>
<style>

img {
       width: 33%;
       height: auto;
       float: left; 
       max-width: 235px;
    }

.blur {
          
		   
		   filter: blur(10px);
	  }
	  
.brightness {
              
			   
			   filter: brightness(50%);
			}
			
.contrast {
              
			 
			  
               filter: contrast(240%);
			   
		  }
		  
.grayscale {
            
			 filter: grayscale(100%);
		   }
		   
.huerotate {
            
			      
			  filter: hue-rotate(220deg);    
		   }
.invert {
          
		   
		   filter: invert(100%);
		}
		
.opacity {
            
			filter: opacity(20%);
			opacity: 0.2;
		
			
			
		 }
		 
.saturate {
             
			 filter: saturate(15);
		  }
		  
.sepia {
            
			filter: sepia(100%);
	   }
	   

</style>
</head>
<body>

<img src = "n2.jpg" width = "200px" height = "200px">


<img class = "blur" src = "n2.jpg" width = "200px" height = "200px">


<img class = "brightness" src = "n2.jpg" width = "200px" height = "200px">


<img class = "contrast" src = "n2.jpg" width = "200px" height = "200px">


<img class = "grayscale" src = "n2.jpg" width = "200px" height = "200px">


<img class = "huerotate" src = "n2.jpg" width = "200px" height = "200px">


<img class = "invert" src = "n2.jpg" width = "200px" height = "200px">


<img class = "opacity" src = "n2.jpg" width = "200px" height = "200px">


<img class = "saturate" src = "n2.jpg" width = "200px" height = "200px">


<img class = "sepia" src = "n2.jpg" width = "200px" height = "200px">


<img class = "shadow" src = "n2.jpg" width = "200px" height = "200px">

</body>
</html>
