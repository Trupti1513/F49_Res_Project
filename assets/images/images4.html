<!DOCTYPE html>
<html>
<head>
<style>

a {
       display: inline-block;
       border: 2px solid #ddd;
       border-radius: 5px;
       padding: 5px;
       transition: 1s;
  }

a:hover {
           box-shadow: 0 0 2px 1px cyan;
        }
</style>
</head>
<body>

<h2> Thumbnail Image as Link </h2>


<a target = "_blank" href = "abs.jpg">

  <img src = "abs.jpg" alt = "abstract" width = "400" height = "300">
  
</a>

</body>
</html>
