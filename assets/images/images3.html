<!--                        Thumbnail Images

Use the border property to create thumbnail images.

-->


<!DOCTYPE html>
<html>
<head>
<style>

img {
       border: 5px solid #ddd;
       border-radius: 4px;
       padding: 5px;
    }
	
</style>
</head>
<body>

<h2> Thumbnail Images </h2>

<p> Use the border property to create thumbnail images: </p>

<img src = "abs.jpg" alt = "abstract" width = "150px" height = "150px">

</body>
</html>
